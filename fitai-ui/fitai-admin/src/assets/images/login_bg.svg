<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 专业渐变背景 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="25%" style="stop-color:#1E293B"/>
      <stop offset="50%" style="stop-color:#0F172A"/>
      <stop offset="75%" style="stop-color:#1E3A5F"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>
    
    <!-- 科技蓝光晕 -->
    <radialGradient id="glow1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="35%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="60%" cy="20%" r="30%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:0"/>
    </radialGradient>
    
    <!-- 网格图案 -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#3B82F6" stroke-width="0.5" opacity="0.08"/>
    </pattern>
    
    <!-- 点阵图案 -->
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#3B82F6" opacity="0.2"/>
    </pattern>
    
    <!-- 渐变线条 -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- 基础背景 -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- 网格层 -->
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.5"/>
  
  <!-- 光晕效果层 -->
  <rect width="100%" height="100%" fill="url(#glow1)"/>
  <rect width="100%" height="100%" fill="url(#glow2)"/>
  <rect width="100%" height="100%" fill="url(#glow3)"/>
  
  <!-- 装饰流线 -->
  <path d="M0,200 Q350,150 700,220 T1400,180" fill="none" stroke="url(#lineGrad)" stroke-width="1.5"/>
  <path d="M0,400 Q400,370 800,410 T1400,380" fill="none" stroke="url(#lineGrad)" stroke-width="1" opacity="0.6"/>
  <path d="M0,600 Q300,570 600,610 T1400,580" fill="none" stroke="url(#lineGrad)" stroke-width="0.8" opacity="0.4"/>
  
  <!-- 代码括号装饰 - 左上 -->
  <g opacity="0.3">
    <path d="M80,120 L50,160 L80,200" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
    <path d="M130,120 L160,160 L130,200" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- 代码括号装饰 - 右下 -->
  <g opacity="0.25">
    <path d="M1250,550 L1220,590 L1250,630" fill="none" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>
    <path d="M1300,550 L1330,590 L1300,630" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- 电路节点 - 左侧 -->
  <g opacity="0.4">
    <circle cx="100" cy="400" r="6" fill="#3B82F6"/>
    <circle cx="100" cy="400" r="12" fill="none" stroke="#3B82F6" stroke-width="1"/>
    <line x1="100" y1="412" x2="100" y2="450" stroke="#3B82F6" stroke-width="1"/>
    <line x1="100" y1="388" x2="100" y2="350" stroke="#3B82F6" stroke-width="1"/>
    <line x1="112" y1="400" x2="150" y2="400" stroke="#3B82F6" stroke-width="1"/>
  </g>
  
  <!-- 电路节点 - 右侧 -->
  <g opacity="0.35">
    <circle cx="1300" cy="300" r="5" fill="#10B981"/>
    <circle cx="1300" cy="300" r="10" fill="none" stroke="#10B981" stroke-width="1"/>
    <line x1="1300" y1="310" x2="1300" y2="340" stroke="#10B981" stroke-width="1"/>
    <line x1="1290" y1="300" x2="1260" y2="300" stroke="#10B981" stroke-width="1"/>
  </g>
  
  <!-- 浮动六边形 -->
  <polygon points="1280,150 1310,167 1310,201 1280,218 1250,201 1250,167" 
           fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" 
                      from="0 1280 184" to="360 1280 184" dur="40s" repeatCount="indefinite"/>
  </polygon>
  
  <polygon points="150,650 175,665 175,695 150,710 125,695 125,665" 
           fill="#6366F1" fill-opacity="0.1" stroke="#6366F1" stroke-width="1" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" 
                      from="0 150 680" to="-360 150 680" dur="35s" repeatCount="indefinite"/>
  </polygon>
  
  <!-- 芯片图标装饰 -->
  <g transform="translate(1200, 450)" opacity="0.25">
    <rect x="0" y="0" width="40" height="40" rx="4" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
    <line x1="10" y1="-8" x2="10" y2="0" stroke="#F59E0B" stroke-width="1"/>
    <line x1="20" y1="-8" x2="20" y2="0" stroke="#F59E0B" stroke-width="1"/>
    <line x1="30" y1="-8" x2="30" y2="0" stroke="#F59E0B" stroke-width="1"/>
    <line x1="10" y1="40" x2="10" y2="48" stroke="#F59E0B" stroke-width="1"/>
    <line x1="20" y1="40" x2="20" y2="48" stroke="#F59E0B" stroke-width="1"/>
    <line x1="30" y1="40" x2="30" y2="48" stroke="#F59E0B" stroke-width="1"/>
  </g>
  
  <!-- 动态粒子 -->
  <circle cx="200" cy="150" r="3" fill="#3B82F6" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="600" r="2.5" fill="#10B981" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="180" r="3.5" fill="#6366F1" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="680" r="2" fill="#F59E0B" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.15;0.4" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="100" r="2" fill="#3B82F6" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.15;0.45" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="400" r="2.5" fill="#10B981" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.15;0.4" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 数据流线 -->
  <g opacity="0.2">
    <line x1="200" y1="200" x2="350" y2="300" stroke="#3B82F6" stroke-width="0.5"/>
    <line x1="350" y1="300" x2="500" y2="280" stroke="#3B82F6" stroke-width="0.5"/>
    <line x1="1100" y1="500" x2="1250" y2="550" stroke="#10B981" stroke-width="0.5"/>
    <line x1="1250" y1="550" x2="1350" y2="500" stroke="#10B981" stroke-width="0.5"/>
  </g>
</svg>
