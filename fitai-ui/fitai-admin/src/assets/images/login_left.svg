<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#4F46E5"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#D97706"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景装饰 -->
  <ellipse cx="300" cy="250" rx="280" ry="220" fill="#3B82F6" opacity="0.05"/>
  
  <!-- 主显示器 -->
  <g filter="url(#shadow)">
    <!-- 显示器外框 -->
    <rect x="100" y="60" width="400" height="260" rx="12" fill="url(#screenGrad)" stroke="#3B82F6" stroke-width="2"/>
    <!-- 显示器支架 -->
    <rect x="270" y="320" width="60" height="30" fill="#334155"/>
    <ellipse cx="300" cy="360" rx="80" ry="12" fill="#334155"/>
  </g>
  
  <!-- 屏幕内容 - 代码编辑器界面 -->
  <g>
    <!-- 编辑器头部 -->
    <rect x="115" y="75" width="370" height="25" rx="4" fill="#1E293B"/>
    <circle cx="130" cy="87" r="5" fill="#EF4444"/>
    <circle cx="148" cy="87" r="5" fill="#F59E0B"/>
    <circle cx="166" cy="87" r="5" fill="#10B981"/>
    
    <!-- 侧边栏 -->
    <rect x="115" y="100" width="50" height="205" fill="#0F172A"/>
    <rect x="125" y="115" width="30" height="4" rx="2" fill="#3B82F6" opacity="0.8"/>
    <rect x="125" y="128" width="25" height="4" rx="2" fill="#6366F1" opacity="0.6"/>
    <rect x="125" y="141" width="30" height="4" rx="2" fill="#10B981" opacity="0.6"/>
    <rect x="125" y="154" width="20" height="4" rx="2" fill="#3B82F6" opacity="0.5"/>
    
    <!-- 代码区域 -->
    <rect x="165" y="100" width="320" height="205" fill="#0D1421"/>
    
    <!-- 代码行 -->
    <text x="175" y="120" fill="#6366F1" font-family="monospace" font-size="10">import</text>
    <text x="210" y="120" fill="#3B82F6" font-family="monospace" font-size="10">{ useState }</text>
    <text x="290" y="120" fill="#6366F1" font-family="monospace" font-size="10">from</text>
    <text x="320" y="120" fill="#10B981" font-family="monospace" font-size="10">'react'</text>
    
    <text x="175" y="138" fill="#6366F1" font-family="monospace" font-size="10">function</text>
    <text x="225" y="138" fill="#F59E0B" font-family="monospace" font-size="10">App()</text>
    <text x="260" y="138" fill="#94A3B8" font-family="monospace" font-size="10">{</text>
    
    <text x="185" y="156" fill="#6366F1" font-family="monospace" font-size="10">const</text>
    <text x="215" y="156" fill="#3B82F6" font-family="monospace" font-size="10">[data, setData]</text>
    <text x="310" y="156" fill="#94A3B8" font-family="monospace" font-size="10">=</text>
    <text x="320" y="156" fill="#F59E0B" font-family="monospace" font-size="10">useState([])</text>
    
    <text x="185" y="174" fill="#6366F1" font-family="monospace" font-size="10">return</text>
    <text x="220" y="174" fill="#94A3B8" font-family="monospace" font-size="10">(</text>
    
    <text x="195" y="192" fill="#EF4444" font-family="monospace" font-size="10">&lt;div</text>
    <text x="225" y="192" fill="#10B981" font-family="monospace" font-size="10">className=</text>
    <text x="295" y="192" fill="#F59E0B" font-family="monospace" font-size="10">"container"</text>
    <text x="370" y="192" fill="#EF4444" font-family="monospace" font-size="10">&gt;</text>
    
    <text x="205" y="210" fill="#94A3B8" font-family="monospace" font-size="10">...</text>
    
    <!-- 光标闪烁效果 -->
    <rect x="220" y="215" width="2" height="12" fill="#3B82F6">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- 浮动窗口 - 终端 -->
  <g transform="translate(380, 180)" filter="url(#shadow)">
    <rect x="0" y="0" width="140" height="100" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <rect x="0" y="0" width="140" height="20" rx="8" fill="#1E293B"/>
    <text x="10" y="14" fill="#10B981" font-family="monospace" font-size="9">Terminal</text>
    <text x="10" y="38" fill="#10B981" font-family="monospace" font-size="8">$ npm run dev</text>
    <text x="10" y="52" fill="#94A3B8" font-family="monospace" font-size="8">Starting...</text>
    <text x="10" y="66" fill="#3B82F6" font-family="monospace" font-size="8">✓ Ready on :3000</text>
    <text x="10" y="80" fill="#10B981" font-family="monospace" font-size="8">$</text>
    <rect x="18" y="72" width="6" height="10" fill="#10B981">
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- 学习者人物 1 - 讲师 -->
  <g transform="translate(40, 320)">
    <!-- 身体 -->
    <ellipse cx="55" cy="145" rx="35" ry="40" fill="url(#blueGrad)"/>
    <!-- 头 -->
    <circle cx="55" cy="85" r="28" fill="#FCD5CE"/>
    <!-- 头发 -->
    <ellipse cx="55" cy="68" rx="28" ry="18" fill="#1E293B"/>
    <!-- 手臂指向 -->
    <ellipse cx="95" cy="120" rx="18" ry="8" fill="url(#blueGrad)" transform="rotate(-20 95 120)"/>
    <circle cx="112" cy="112" r="8" fill="#FCD5CE"/>
    <!-- 教鞭/激光笔 -->
    <line x1="118" y1="108" x2="165" y2="85" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <circle cx="165" cy="85" r="4" fill="#EF4444" filter="url(#glow)"/>
  </g>
  
  <!-- 学习者人物 2 - 学生（使用笔记本） -->
  <g transform="translate(200, 340)">
    <!-- 身体 -->
    <ellipse cx="70" cy="130" rx="38" ry="42" fill="url(#purpleGrad)"/>
    <!-- 头 -->
    <circle cx="70" cy="75" r="30" fill="#FCD5CE"/>
    <!-- 头发 -->
    <path d="M40 65 Q40 40 70 40 Q100 40 100 65 Q100 55 70 58 Q40 55 40 65" fill="#4A3728"/>
    <!-- 笔记本电脑 -->
    <rect x="30" y="100" width="80" height="50" rx="4" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
    <rect x="35" y="105" width="70" height="35" rx="2" fill="#0F172A"/>
    <!-- 屏幕内容 -->
    <rect x="40" y="110" width="25" height="3" rx="1" fill="#3B82F6" opacity="0.8"/>
    <rect x="40" y="118" width="35" height="3" rx="1" fill="#10B981" opacity="0.6"/>
    <rect x="40" y="126" width="20" height="3" rx="1" fill="#6366F1" opacity="0.6"/>
    <!-- 键盘 -->
    <rect x="30" y="150" width="80" height="8" rx="2" fill="#334155"/>
  </g>
  
  <!-- 学习者人物 3 - 学生（专注学习） -->
  <g transform="translate(420, 340)">
    <!-- 身体 -->
    <ellipse cx="55" cy="125" rx="32" ry="38" fill="url(#greenGrad)"/>
    <!-- 头 -->
    <circle cx="55" cy="70" r="26" fill="#FCD5CE"/>
    <!-- 头发 -->
    <ellipse cx="55" cy="55" rx="26" ry="16" fill="#1E293B"/>
    <!-- 手臂 - 举手 -->
    <ellipse cx="90" cy="95" rx="15" ry="7" fill="url(#greenGrad)" transform="rotate(-60 90 95)"/>
    <circle cx="100" cy="78" r="7" fill="#FCD5CE"/>
    <!-- 书本 -->
    <rect x="25" y="115" width="35" height="45" rx="2" fill="#F59E0B"/>
    <line x1="42" y1="115" x2="42" y2="160" stroke="#D97706" stroke-width="2"/>
    <rect x="30" y="120" width="8" height="2" fill="#FFF" opacity="0.6"/>
    <rect x="30" y="128" width="10" height="2" fill="#FFF" opacity="0.6"/>
    <rect x="30" y="136" width="6" height="2" fill="#FFF" opacity="0.6"/>
  </g>
  
  <!-- 装饰元素 - 代码括号 -->
  <g opacity="0.4">
    <path d="M30,80 L15,120 L30,160" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
    <path d="M570,80 L585,120 L570,160" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- 浮动图标 - 技术栈 -->
  <g transform="translate(520, 280)">
    <circle cx="0" cy="0" r="18" fill="url(#blueGrad)" opacity="0.9"/>
    <text x="0" y="5" text-anchor="middle" fill="#FFF" font-size="12" font-weight="bold">JS</text>
  </g>
  <g transform="translate(550, 340)">
    <circle cx="0" cy="0" r="15" fill="url(#purpleGrad)" opacity="0.85"/>
    <text x="0" y="4" text-anchor="middle" fill="#FFF" font-size="10" font-weight="bold">TS</text>
  </g>
  <g transform="translate(30, 250)">
    <circle cx="0" cy="0" r="16" fill="url(#greenGrad)" opacity="0.85"/>
    <text x="0" y="4" text-anchor="middle" fill="#FFF" font-size="9" font-weight="bold">Vue</text>
  </g>
  
  <!-- 连接线 -->
  <line x1="100" y1="475" x2="500" y2="475" stroke="url(#blueGrad)" stroke-width="2" opacity="0.4"/>
  
  <!-- 装饰粒子 -->
  <circle cx="150" cy="40" r="3" fill="#3B82F6" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="50" r="2.5" fill="#10B981" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="560" cy="200" r="2" fill="#6366F1" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="180" r="2.5" fill="#F59E0B" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.15;0.45" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>
