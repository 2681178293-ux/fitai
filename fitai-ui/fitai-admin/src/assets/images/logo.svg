<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="lightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
  </defs>
  
  <!-- 外框 - 圆角矩形 -->
  <rect x="20" y="20" width="160" height="160" rx="32" fill="url(#primaryGrad)"/>
  
  <!-- 内部装饰圆 -->
  <circle cx="100" cy="100" r="65" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.1"/>
  
  <!-- W 字母主体 -->
  <g fill="#FFFFFF">
    <!-- W 的左斜线 -->
    <polygon points="45,55 60,55 80,130 65,130"/>
    
    <!-- W 的左中斜线 -->
    <polygon points="72,130 87,130 100,90 92,90"/>
    
    <!-- W 的右中斜线 -->
    <polygon points="108,90 100,90 113,130 128,130"/>
    
    <!-- W 的右斜线 -->
    <polygon points="120,130 135,130 155,55 140,55"/>
  </g>
  
  <!-- W 中间的连接点 - 强调点 -->
  <circle cx="100" cy="88" r="8" fill="url(#accentGrad)"/>
  
  <!-- 底部装饰线 -->
  <rect x="60" y="145" width="80" height="4" rx="2" fill="#FFFFFF" opacity="0.3"/>
  
  <!-- 右上角装饰点 -->
  <circle cx="155" cy="45" r="6" fill="url(#accentGrad)" opacity="0.8"/>
</svg>
